# ZarinPay на zarinpay.glossa.best.
#
# Проект работает на SQLite — файл базы и загруженные файлы вынесены на хост, иначе
# пересборка образа стирала бы и то и другое. Портов наружу нет: запросы приводит
# nginx главного сайта через сеть glossa_default.

name: zarinpay

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.prod
    volumes:
      - ${DATA_ROOT:-/home/magajan/projects-data/zarinpay}/db.sqlite3:/app/db.sqlite3
      - ${DATA_ROOT:-/home/magajan/projects-data/zarinpay}/media:/app/media
    networks:
      - glossa

networks:
  glossa:
    external: true
    name: glossa_default
